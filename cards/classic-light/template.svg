<svg xmlns="http://www.w3.org/2000/svg" width="420" height="200" viewBox="0 0 420 200" role="img" aria-label="Classic Light 用量卡">
<defs>
<linearGradient id="a-accent" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#087FFA"></stop>
<stop offset="100%" stop-color="#3B9BFF"></stop>
</linearGradient>
</defs>
<path d="M0 0H406Q420 0 420 14V186Q420 200 406 200H0Z" fill="#FFFFFF"></path>
<path d="M5 0.5H406Q419.5 0.5 419.5 14V186Q419.5 199.5 406 199.5H5" fill="none" stroke="#E5EAF2" stroke-width="1"></path>
<rect x="0" y="0" width="5" height="200" fill="#087FFA"></rect>
{{#if avatar}}
{{avatar}}
{{/if}}
<text x="{{x_name}}" y="32" fill="#1A1D24" font-size="14" font-weight="600" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">{{name}}</text>
{{#if subtitle}}
<text x="{{x_name}}" y="48" fill="#8B93A7" font-size="11" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">{{subtitle}}</text>
{{/if}}
{{#if total}}
<g transform="translate({{x_total}} 0)">
<text x="0" y="88" fill="#8B93A7" font-size="11" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">总 Token</text>
<text x="0" y="118" fill="#1A1D24" font-size="24" font-weight="650" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="-0.5">{{total}}</text>
</g>
{{/if}}
{{#if cost}}
<g transform="translate({{x_cost}} 0)">
<text x="0" y="88" fill="#8B93A7" font-size="11" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">累计费用</text>
<text x="0" y="118" fill="#087FFA" font-size="24" font-weight="650" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="-0.5">{{cost}}</text>
</g>
{{/if}}
{{#if today}}
<g transform="translate({{x_today}} 0)">
<text x="0" y="88" fill="#8B93A7" font-size="11" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">今日 Token</text>
<text x="0" y="118" fill="#1A1D24" font-size="22" font-weight="600" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">{{today}}</text>
</g>
{{/if}}
<line x1="28" y1="148" x2="392" y2="148" stroke="#EEF1F6" stroke-width="1"></line>
<text x="28" y="172" fill="#A0A8B8" font-size="11" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">掘金 AI Usage</text>
{{#if since}}
<text x="392" y="172" text-anchor="end" fill="#A0A8B8" font-size="11" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">{{since}}</text>
{{/if}}
</svg>
