<svg xmlns="http://www.w3.org/2000/svg" width="420" height="200" viewBox="0 0 420 200" role="img" aria-label="Stats Row 用量卡">
<rect width="420" height="200" rx="14" fill="#FFFFFF" stroke="#E5EAF2" stroke-width="1"></rect>
{{#if avatar}}
{{avatar}}
{{/if}}
{{#if name}}
<text x="{{x_name}}" y="28" fill="#1A1D24" font-size="13" font-weight="600" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">{{name}}</text>
<text x="{{x_name}}" y="44" fill="#8B93A7" font-size="10" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">{{#if total}}总 {{total}}{{/if}}{{#if cost}}{{#if total}} · {{/if}}费用 {{cost}}{{/if}}</text>
{{/if}}
{{#if total}}
<g transform="translate({{x_total}} {{y_metrics}})">
<rect x="0" y="64" width="120" height="88" rx="10" fill="#F5F8FC"></rect>
<text x="14" y="88" fill="#8B93A7" font-size="11" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">总 Token</text>
<text x="14" y="118" fill="#1A1D24" font-size="22" font-weight="650" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">{{total}}</text>
{{#if totalPct}}
<text x="14" y="138" fill="#A0A8B8" font-size="10" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">{{totalPct}}</text>
{{/if}}
</g>
{{/if}}
{{#if input}}
<g transform="translate({{x_input}} {{y_metrics}})">
<rect x="0" y="64" width="120" height="88" rx="10" fill="#F5F8FC"></rect>
<text x="14" y="88" fill="#8B93A7" font-size="11" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">输入</text>
<text x="14" y="118" fill="#1A1D24" font-size="22" font-weight="650" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">{{input}}</text>
{{#if inputPct}}
<text x="14" y="138" fill="#A0A8B8" font-size="10" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">{{inputPct}}</text>
{{/if}}
</g>
{{/if}}
{{#if output}}
<g transform="translate({{x_output}} {{y_metrics}})">
<rect x="0" y="64" width="120" height="88" rx="10" fill="#F5F8FC"></rect>
<text x="14" y="88" fill="#8B93A7" font-size="11" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">输出</text>
<text x="14" y="118" fill="#1A1D24" font-size="22" font-weight="650" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">{{output}}</text>
{{#if outputPct}}
<text x="14" y="138" fill="#A0A8B8" font-size="10" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">{{outputPct}}</text>
{{/if}}
</g>
{{/if}}
<text x="20" y="180" fill="#A0A8B8" font-size="11" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">掘金 AI Usage</text>
{{#if since}}
<text x="400" y="180" text-anchor="end" fill="#A0A8B8" font-size="11" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">{{since}}</text>
{{/if}}
</svg>
