<svg xmlns="http://www.w3.org/2000/svg" width="420" height="200" viewBox="0 0 420 200" role="img" aria-label="Classic Dark 用量卡">
<rect width="420" height="200" rx="14" fill="#141B1A"></rect>
<rect x="0" y="0" width="5" height="200" fill="#087FFA"></rect>
{{#if avatar}}
{{avatar}}
{{/if}}
<text x="{{x_name}}" y="32" fill="#FFFFFF" font-size="14" font-weight="600" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">{{name}}</text>
{{#if subtitle}}
<text x="{{x_name}}" y="48" fill="rgba(255,255,255,0.45)" font-size="11" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">{{subtitle}}</text>
{{/if}}
<g transform="translate({{x_total}} 0)">
<text x="0" y="88" fill="rgba(255,255,255,0.45)" font-size="11" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">总 Token</text>
<text x="0" y="118" fill="#FFFFFF" font-size="24" font-weight="650" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="-0.5">{{total}}</text>
</g>
{{#if cost}}
<g transform="translate({{x_cost}} 0)">
<text x="0" y="88" fill="rgba(255,255,255,0.45)" font-size="11" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">累计费用</text>
<text x="0" y="118" fill="#11EE8C" font-size="24" font-weight="650" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="-0.5">{{cost}}</text>
</g>
{{/if}}
{{#if today}}
<g transform="translate({{x_today}} 0)">
<text x="0" y="88" fill="rgba(255,255,255,0.45)" font-size="11" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">今日 Token</text>
<text x="0" y="118" fill="#FFFFFF" font-size="22" font-weight="600" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">{{today}}</text>
</g>
{{/if}}
<line x1="28" y1="148" x2="392" y2="148" stroke="rgba(255,255,255,0.1)" stroke-width="1"></line>
<text x="28" y="172" fill="rgba(255,255,255,0.4)" font-size="11" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">掘金 AI Usage</text>
{{#if since}}
<text x="392" y="172" text-anchor="end" fill="rgba(255,255,255,0.4)" font-size="11" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">{{since}}</text>
{{/if}}
</svg>
