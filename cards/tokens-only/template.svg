<svg xmlns="http://www.w3.org/2000/svg" width="420" height="200" viewBox="0 0 420 200" role="img" aria-label="Tokens-only 用量卡">
<rect width="420" height="200" rx="14" fill="#FFFFFF" stroke="#E5EAF2" stroke-width="1"></rect>
<rect x="0" y="0" width="5" height="200" fill="#087FFA"></rect>
{{#if avatar}}
{{avatar}}
{{/if}}
<text x="{{x_name}}" y="32" fill="#1A1D24" font-size="14" font-weight="600" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">{{name}}</text>
{{#if subtitle}}
<text x="{{x_name}}" y="48" fill="#8B93A7" font-size="11" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">{{subtitle}}</text>
{{/if}}
{{#if total}}
<g transform="translate({{x_total}} 0)">
<text x="0" y="92" fill="#8B93A7" font-size="11" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">总 Token</text>
<text x="0" y="128" fill="#1A1D24" font-size="36" font-weight="650" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="-0.8">{{total}}</text>
</g>
{{/if}}
{{#if today}}
<g transform="translate({{x_today}} 0)">
<text x="0" y="92" fill="#8B93A7" font-size="11" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">今日 Token</text>
<text x="0" y="128" fill="#1A1D24" font-size="28" font-weight="600" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">{{today}}</text>
</g>
{{/if}}
<line x1="28" y1="152" x2="392" y2="152" stroke="#EEF1F6" stroke-width="1"></line>
<text x="28" y="174" fill="#A0A8B8" font-size="11" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">掘金 AI Usage</text>
{{#if since}}
<text x="392" y="174" text-anchor="end" fill="#A0A8B8" font-size="11" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">{{since}}</text>
{{/if}}
</svg>
