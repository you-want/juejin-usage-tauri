name: release-tauri

# Tauri 社区版发版：多平台构建 + minisign 签名 + GitHub Release（含 latest.json）。
# 触发：推送 v* 标签（如 v0.2.0）。
#
# 首次使用前需要在仓库 Settings → Secrets and variables → Actions 添加：
#   TAURI_SIGNING_PRIVATE_KEY         私钥文件内容（~/.tauri/juejin-usage-community.key）
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  留空的占位（密钥未设密码）— secret 不能为空值，
#                                       可设为任意非敏感字符串，updater 只在密钥有密码时使用
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  # 阶段①-2 体积瘦身：macOS 用 small-icu 自建 node（官方构建内嵌全量 ICU ~30MB）。
  # core 的 4 处 Intl 调用均为 formatToParts 构造（locale 无关），small-icu 安全。
  build-node-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin-arm64
          - os: macos-15-intel
            platform: darwin-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Cache small-icu node build
        id: cache
        uses: actions/cache@v4
        with:
          path: node-small-icu
          key: node-small-icu-${{ matrix.platform }}-v22.22.1

      - name: Build node from source (--with-intl=small-icu)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o node-src.tar.gz https://nodejs.org/dist/v22.22.1/node-v22.22.1.tar.gz
          tar xzf node-src.tar.gz
          cd node-v22.22.1
          ./configure --with-intl=small-icu
          make -j3
          mkdir -p ../node-small-icu
          cp ./node ../node-small-icu/node

      - uses: actions/upload-artifact@v4
        with:
          name: node-small-icu-${{ matrix.platform }}
          path: node-small-icu/node

  build:
    needs: build-node-macos
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14          # Apple Silicon
            target: aarch64-apple-darwin
            platform: darwin-arm64
          - os: macos-15-intel   # GitHub 最后的 x86_64 镜像（支持至 2027-08）
            target: x86_64-apple-darwin
            platform: darwin-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # pnpm 版本来自根 package.json 的 packageManager 字段
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop-tauri/src-tauri

      - name: Toolchain sanity
        run: node --version && pnpm --version

      - name: Install deps
        env:
          # Tauri 发版不构建 Electron 应用：跳过 electron 二进制下载
          # （apps/desktop/.npmrc 的 npmmirror 镜像对海外 runner 不稳定）
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
        run: pnpm install --frozen-lockfile || (sleep 20 && pnpm install --frozen-lockfile)

      - name: Download small-icu node (macOS)
        if: runner.os == 'macOS'
        uses: actions/download-artifact@v4
        with:
          name: node-small-icu-${{ matrix.platform }}
          path: node-small-icu

      - name: Make small-icu node executable (macOS)
        if: runner.os == 'macOS'
        run: chmod +x node-small-icu/node && echo "TUD_NODE_BIN=$PWD/node-small-icu/node" >> "$GITHUB_ENV"

      - name: Build core + cli
        run: pnpm run build:cli

      # stage 复用 runner 自带的官方 node（架构与构建目标一致），无需单独下载
      - name: Stage node runtime + cli dist + dashboard into node-app/
        run: pnpm stage:desktop:tauri

      - name: Build Tauri bundle (signed)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          # 诊断（不泄露内容）：确认密钥 secret 已配置
          echo "signing key length: ${#TAURI_SIGNING_PRIVATE_KEY}"
          pnpm --filter @juejin-opensource/jusage-desktop-tauri tauri build --target ${{ matrix.target }}

      - name: Collect artifacts + per-platform updater manifest
        shell: bash
        run: |
          BUNDLE=apps/desktop-tauri/src-tauri/target/${{ matrix.target }}/release/bundle
          mkdir -p dist-upload
          PLAT=${{ matrix.platform }}
          # macOS: dmg 在 bundle/dmg/；更新包 .app.tar.gz 按架构重命名防互相覆盖
          find "$BUNDLE/dmg" -name '*.dmg' -exec cp {} dist-upload/ \; 2>/dev/null || true
          find "$BUNDLE/macos" -name 'Juejin Usage.app.tar.gz' -exec cp {} "dist-upload/Juejin-Usage-$PLAT.app.tar.gz" \; 2>/dev/null || true
          find "$BUNDLE/macos" -name 'Juejin Usage.app.tar.gz.sig' -exec cp {} "dist-upload/Juejin-Usage-$PLAT.app.tar.gz.sig" \; 2>/dev/null || true
          # Windows: nsis 安装器即更新包，附 .sig
          find "$BUNDLE/nsis" \( -name '*-setup.exe' -o -name '*-setup.exe.sig' \) -exec cp {} dist-upload/ \; 2>/dev/null || true
          ls -la dist-upload
          ls -la dist-upload

      - uses: actions/upload-artifact@v4
        with:
          name: tauri-${{ matrix.platform }}
          path: dist-upload/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # node-small-icu 构建作业的产物（裸 node 二进制）会随 download-artifact
      # 混进发布目录——它只是 staging 的输入，不属于 Release 资产
      - name: Drop non-release artifacts
        run: rm -f artifacts/node && ls artifacts

      # tauri CLI 只产出 *.tar.gz/.zip + .sig，latest.json 由本步骤生成
      # （updater v1 格式：platforms.<key>.{signature, url}）
      - name: Generate latest.json from artifacts
        shell: bash
        run: |
          node - <<'EOF'
          const fs = require("fs");
          const path = require("path");
          const tag = process.env.GITHUB_REF_NAME.replace(/^v/, "");
          const dir = "artifacts";
          const files = fs.readdirSync(dir);
          const platforms = {};
          const sigFor = (base) => {
            for (const c of [base + ".sig", base + ".zip.sig"]) {
              if (fs.existsSync(path.join(dir, c))) return fs.readFileSync(path.join(dir, c), "utf8").trim();
            }
            return null;
          };
          const baseUrl = `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${process.env.GITHUB_REF_NAME}`;
          const need = (f, sig) => {
            if (!sig) { console.error("no .sig found for", f, "- files:", files.join(" | ")); process.exit(1); }
            return sig;
          };
          for (const f of files) {
            if (f.endsWith(".app.tar.gz") && !f.endsWith(".sig")) {
              const key = f.includes("arm64") || f.includes("aarch64") ? "darwin-aarch64" : "darwin-x86_64";
              platforms[key] = { signature: need(f, sigFor(f)), url: `${baseUrl}/${encodeURIComponent(f)}` };
            }
            if (f.endsWith("-setup.exe") || (f.endsWith(".exe") && !f.endsWith(".sig"))) {
              platforms["windows-x86_64"] = {
                signature: need(f, sigFor(f) || sigFor(f.replace(/\.exe$/, ".zip"))),
                url: `${baseUrl}/${encodeURIComponent(f)}`,
              };
            }
            if (f.endsWith(".msi.zip") && !f.endsWith(".sig")) {
              platforms["windows-x86_64"] = { signature: need(f, sigFor(f)), url: `${baseUrl}/${encodeURIComponent(f)}` };
            }
          }
          if (Object.keys(platforms).length === 0) { console.error("no updater artifacts found:", files.join(", ")); process.exit(1); }
          const manifest = { version: tag, notes: "Tauri community edition " + tag, pub_date: new Date().toISOString(), platforms };
          fs.writeFileSync(path.join(dir, "latest.json"), JSON.stringify(manifest, null, 2));
          console.log(JSON.stringify(platforms, null, 2));
          EOF

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
